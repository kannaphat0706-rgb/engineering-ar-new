
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>AR เฉลยภาพตัด - ชิ้นงานที่ 1</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .header {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255,255,255,0.94);
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      width: 82%;
      max-width: 420px;
      font-size: 15px;
      font-weight: bold;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #1769aa;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      text-decoration: none;
      width: 80%;
      max-width: 360px;
    }
  </style>
</head>

<body>

  <div class="header">
    AR เฉลยชิ้นงานที่ 1<br>
    ส่องกล้องไปที่ Marker เฉลย
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <img id="answerImage" src="answer_01.jpg">
    </a-assets>

    <a-marker
  type="pattern"
  url="pattern-Picture1.patt">
      <a-marker
  type="pattern"
  url="pattern-Picture1.patt">

  <a-plane
    src="#answerImage"
    position="0 0.02 0"
    rotation="-90 0 0"
    width="2"
    height="1.414"
    material="side: double; transparent: false">
  </a-plane>

</a-marker>

      <a-plane
        src="#answerImage"
        position="0 0.02 0"
        rotation="-90 0 0"
        width="2"
        height="1.414"
        material="side: double; transparent: false">
      </a-plane>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <a class="footer"
     href="answer_01.jpg"
     target="_blank">
    เปิดภาพเฉลยเต็มหน้าจอ
  </a>

</body>
</html>


<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>สแกน Marker เฉลยชิ้นงานที่ 1</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #instruction {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 14px;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      text-align: center;
      z-index: 10;
    }

    #answer {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      z-index: 100;
      overflow: auto;
      text-align: center;
    }

    #answer img {
      width: 100%;
      height: auto;
      display: block;
    }

    #back {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      z-index: 101;
    }
  </style>
</head>

<body>

  <div id="instruction">
    สแกน Marker เฉลยชิ้นงานที่ 1
    <div>ส่องกล้องไปที่ภาพชิ้นงาน</div>
  </div>

  <div id="answer">
    <img src="answer_01.jpg"
         alt="แบบงานเฉลยชิ้นงานที่ 1">

    <button id="back" onclick="closeAnswer()">
      กลับไปสแกน
    </button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="answerMarker"
      type="pattern"
      url="answer-marker.patt">

      <a-box
        position="0 -100 0"
        visible="false">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
  const marker = document.getElementById("answerMarker");
  const answer = document.getElementById("answer");

  let answerOpened = false;
  let waitingForMarkerExit = false;

  marker.addEventListener("markerFound", function () {
    if (!answerOpened && !waitingForMarkerExit) {
      answer.style.display = "block";
      answerOpened = true;
    }
  });

  marker.addEventListener("markerLost", function () {
    waitingForMarkerExit = false;
  });

  function closeAnswer() {
    answer.style.display = "none";
    answerOpened = false;

    // ต้องยกกล้องออกจาก Marker ก่อนสแกนใหม่
    waitingForMarkerExit = marker.object3D.visible;
  }
</script>

</body>
</html>

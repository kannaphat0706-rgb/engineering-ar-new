
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR ชิ้นงานที่ 1</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #viewer {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 20px;
      border-radius: 30px;
      background: #164c96;
      color: white;
      font: bold 16px sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      top: 15px;
      left: 0;
      right: 0;
      z-index: 1000;
      text-align: center;
      color: white;
      font: bold 16px sans-serif;
      text-shadow: 0 1px 5px black;
      padding: 0 15px;
    }
  </style>
</head>

<body>

  <div id="hint">
    กรุณาสแกน Marker โจทย์ชิ้นงานที่ 1
  </div>

  <a id="viewer" href="index.html">
    ดูโมเดล 3 มิติแบบละเอียด
  </a>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="problemMarker"
      type="pattern"
      url="pattern-messageImage_1792396176708.patt">

      <a-entity
        gltf-model="url(model_full_cad_v2.glb)"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.0095 0.0095 0.0095">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.getElementById("problemMarker");
    const viewer = document.getElementById("viewer");
    const hint = document.getElementById("hint");

    let scanned = false;

    marker.addEventListener("markerFound", function () {
      if (!scanned) {
        scanned = true;
        viewer.style.display = "block";
        hint.textContent = "สแกนสำเร็จ! สามารถดูโมเดล 3 มิติแบบละเอียดได้";
      }
    });
  </script>

</body>
</html>
